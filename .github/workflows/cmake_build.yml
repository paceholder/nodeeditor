name: build nodeeditor

on:
  push:
    branches:
      - master
      - main
    tags:
      - "*"
  pull_request:

jobs:
  build-and-test:

    name: ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - linux-gcc
          - macos-clang
          - windows-msvc-qt5
          - windows-msvc-qt6
          - windows-msvc-static

        configuration:
          - Release

        include:
          - toolchain: linux-gcc
            os: ubuntu-22.04
            compiler: gcc
            qt_version: "5.15.2"
            modules: ""
            use_qt6: "OFF"

          - toolchain: macos-clang
            os: macos-latest
            compiler: clang
            qt_version: "6.9.2"
            modules: ""
            use_qt6: "ON"

          - toolchain: windows-msvc-qt5
            os: windows-latest
            compiler: msvc
            qt_version: "5.15.2"
            modules: ""
            use_qt6: "OFF"

          - toolchain: windows-msvc-qt6
            os: windows-latest
            compiler: msvc
            qt_version: "6.9.2"
            modules: "qt5compat"
            use_qt6: "ON"

          # Static library. One job is enough: the tests link it and see the
          # NODE_EDITOR_STATIC define, so the examples are skipped to save time.
          - toolchain: windows-msvc-static
            os: windows-latest
            compiler: msvc
            qt_version: "6.9.2"
            modules: "qt5compat"
            use_qt6: "ON"
            shared: "OFF"
            examples: "OFF"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2
      with:
        submodules: true

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt_version }}
        modules: ${{ matrix.modules }}

    - name: Setup (Linux)
      if: startsWith (matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install libxkbcommon-dev xvfb

    - name: Setup VS tools (Windows)
      if: startsWith (matrix.os, 'windows')
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Configure (${{ matrix.configuration }})
      run: cmake -S . -Bbuild -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DBUILD_DOCS=OFF -DUSE_QT6=${{ matrix.use_qt6 }} -DBUILD_SHARED_LIBS=${{ matrix.shared || 'ON' }} -DBUILD_EXAMPLES=${{ matrix.examples || 'ON' }}

    - name: Build with ${{ matrix.compiler }}
      run: cmake --build build --config ${{ matrix.configuration }}

    - name: Run Tests (Linux)
      if: startsWith (matrix.os, 'ubuntu')
      run: |
        cd build
        xvfb-run -a ctest --output-on-failure --progress

    - name: Run Tests (macOS)
      if: startsWith (matrix.os, 'macos')
      run: |
        cd build
        ctest --output-on-failure --progress

    - name: Run Tests (Windows)
      if: startsWith (matrix.os, 'windows')
      run: |
        cd build
        ctest -C ${{ matrix.configuration }} --output-on-failure --progress
